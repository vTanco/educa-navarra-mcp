name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run pack:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: educa-navarra-mcp.mcpb
          path: build/educa-navarra-mcp.mcpb
          retention-days: 14
