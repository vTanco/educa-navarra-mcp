name: Publicar versión

# Se lanza al subir una etiqueta vX.Y.Z, o a mano desde la pestaña Actions
# ("Run workflow"), que crea la etiqueta con la versión de package.json.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # crear la versión en GitHub con el .mcpb
  id-token: write # publicación en npm sin tokens (trusted publishing) y procedencia

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Versión y etiqueta
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $v de package.json"; exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run pack:mcpb
      - name: Crear la versión en GitHub con el paquete de Claude Desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La versión $tag ya existe en GitHub; solo se actualiza el .mcpb."
            gh release upload "$tag" build/educa-navarra-mcp.mcpb --clobber
          else
            gh release create "$tag" build/educa-navarra-mcp.mcpb --target "$GITHUB_SHA" \
              --title "$tag" --notes "Descarga **educa-navarra-mcp.mcpb** y haz doble clic para instalarlo en Claude Desktop. Cambios: ver CHANGELOG.md."
          fi
      - name: Publicar en npm
        run: |
          npm install -g npm@latest
          if npm view "educa-navarra-mcp@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "Esta versión ya está en npm; no se vuelve a publicar."
          else
            # Trusted publishing (sin tokens): la versión queda en espera y la
            # aprueba la persona mantenedora en npmjs.com → Staged Packages.
            npm stage publish --provenance --access public
            echo "::notice::Versión enviada a npm. Apruébala en npmjs.com → Staged Packages."
          fi
