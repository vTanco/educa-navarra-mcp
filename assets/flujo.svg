<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
  <title id="t">Cómo mete las notas</title>
  <desc id="d">Cinco pasos: tu Excel, vista previa, escribe en pantalla sin guardar, tú revisas y Aceptar solo si lo confirmas. Cerrar y firmar la evaluación se hace siempre a mano.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .you { fill: #fff5f5; stroke: #B5121B; }
    .num { fill: #57606a; }
    .numyou { fill: #B5121B; }
    .n { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #57606a; font-size: 12.5px; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .foot { fill: #57606a; font-size: 12.5px; }
    .tag { fill: #B5121B; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .card, .row, .pill { fill: #161b22; stroke: #30363d; }
      .row { stroke: none; }
      .you { fill: #2a1416; stroke: #e5534b; }
      .num { fill: #6e7681; } .numyou, .bad { fill: #e5534b; }
      .h, .b, .td, .new { fill: #e6edf3; }
      .s, .m, .th, .tdm, .foot { fill: #8d96a0; }
      .tag { fill: #ff7b72; }
      .arrow { stroke: #6e7681; }
      .ok { fill: #3fb950; } .warn { fill: #d29922; } .same { fill: #6e7681; }
      line { stroke: #30363d; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="249" rx="12"/>

  <!-- 1 -->
  <rect class="card" x="24" y="40" width="160" height="128" rx="10"/>
  <circle class="num" cx="48" cy="66" r="13"/><text class="n" x="48" y="71" text-anchor="middle">1</text>
  <text class="h" x="36" y="104">Tu Excel</text>
  <text class="s" x="36" y="126">Lo busca en tu carpeta</text>
  <text class="s" x="36" y="144">de notas, o lo adjuntas</text>

  <path class="arrow" d="M188 104 h14 m-6 -5 l6 5 l-6 5"/>

  <!-- 2 -->
  <rect class="card" x="206" y="40" width="160" height="128" rx="10"/>
  <circle class="num" cx="230" cy="66" r="13"/><text class="n" x="230" y="71" text-anchor="middle">2</text>
  <text class="h" x="218" y="104">Vista previa</text>
  <text class="s" x="218" y="126">Nota actual, nota nueva</text>
  <text class="s" x="218" y="144">y avisos. No cambia nada</text>

  <path class="arrow" d="M370 104 h14 m-6 -5 l6 5 l-6 5"/>

  <!-- 3 -->
  <rect class="card" x="388" y="40" width="160" height="128" rx="10"/>
  <circle class="num" cx="412" cy="66" r="13"/><text class="n" x="412" y="71" text-anchor="middle">3</text>
  <text class="h" x="400" y="104">Escribe en Educa</text>
  <text class="s" x="400" y="126">Rellena la pantalla,</text>
  <text class="s" x="400" y="144">sin guardar</text>

  <path class="arrow" d="M552 104 h14 m-6 -5 l6 5 l-6 5"/>

  <!-- 4 -->
  <rect class="you" x="570" y="40" width="160" height="128" rx="10"/>
  <circle class="numyou" cx="594" cy="66" r="13"/><text class="n" x="594" y="71" text-anchor="middle">4</text>
  <text class="tag" x="616" y="70">TÚ</text>
  <text class="h" x="582" y="104">Revisas</text>
  <text class="s" x="582" y="126">Miras la ventana de</text>
  <text class="s" x="582" y="144">Educa con tus ojos</text>

  <path class="arrow" d="M734 104 h14 m-6 -5 l6 5 l-6 5"/>

  <!-- 5 -->
  <rect class="you" x="752" y="40" width="184" height="128" rx="10"/>
  <circle class="numyou" cx="776" cy="66" r="13"/><text class="n" x="776" y="71" text-anchor="middle">5</text>
  <text class="tag" x="798" y="70">TÚ DECIDES</text>
  <text class="h" x="764" y="104">Pulsa Aceptar</text>
  <text class="s" x="764" y="126">Solo cuando lo confirmas</text>
  <text class="s" x="764" y="144">en el chat. Si no, Cancelar</text>

  <line x1="24" y1="196" x2="936" y2="196" stroke="#d0d7de"/>
  <text class="foot" x="24" y="224">Cerrar, firmar o publicar la evaluación: siempre a mano. El conector se niega a pulsar esos botones.</text>
</svg>
