<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="t d">
  <title id="t">Ejemplo de fichero de notas</title>
  <desc id="d">Hoja de cálculo de ejemplo llamada 1EV_BTO-1A_TIC.xlsx con columnas Apellidos, Nombre, Nota y Observaciones. Notas: el nombre del fichero sigue el patrón evaluación, grupo y materia; cabeceras en la primera fila; las notas en blanco se saltan; la columna Observaciones es opcional. Datos inventados.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .you { fill: #fff5f5; stroke: #B5121B; }
    .box { fill: none; stroke: #8c959f; stroke-dasharray: 5 4; }
    .num { fill: #57606a; } .numyou { fill: #B5121B; }
    .n { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .t { fill: #1f2328; font-size: 17px; font-weight: 600; }
    .s { fill: #57606a; font-size: 12.5px; }
    .m { fill: #57606a; font-size: 13px; }
    .td { fill: #1f2328; font-size: 13px; }
    .b { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .th { fill: #57606a; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; }
    .tag { fill: #B5121B; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
    .line { stroke: #d0d7de; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .warnline { stroke: #B5121B; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .ok { fill: #1a7f37; } .bad { fill: #B5121B; } .grey { fill: #8c959f; }
    .accent { fill: #B5121B; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .card { fill: #161b22; stroke: #30363d; }
      .you { fill: #2a1416; stroke: #e5534b; }
      .box { stroke: #6e7681; }
      .num { fill: #6e7681; } .numyou, .accent { fill: #e5534b; }
      .h, .t, .td, .b { fill: #e6edf3; }
      .s, .m, .th { fill: #8d96a0; }
      .tag { fill: #ff7b72; }
      .line { stroke: #30363d; }
      .arrow { stroke: #6e7681; }
      .warnline { stroke: #e5534b; }
      .ok { fill: #3fb950; } .bad { fill: #e5534b; } .grey { fill: #6e7681; }
    }

    .sheet { fill: #ffffff; stroke: #d0d7de; } .hdr { fill: #f6f8fa; } .grid { stroke: #d0d7de; }
    .bar { fill: #1E7145; } .bart { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .col { fill: #8c959f; font-size: 11px; }
    .hl { fill: none; stroke: #B5121B; stroke-width: 1.6; }
    .note { fill: #57606a; font-size: 12.5px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .sheet { fill: #0d1117; stroke: #30363d; } .hdr { fill: #161b22; } .grid { stroke: #30363d; }
      .bar { fill: #1E5C3A; } .col { fill: #6e7681; } .hl { stroke: #e5534b; } .note { fill: #8d96a0; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="323" rx="12"/>
  <rect class="sheet" x="24" y="24" width="600" height="258" rx="8"/>
  <path class="bar" d="M24 32 a8 8 0 0 1 8 -8 h584 a8 8 0 0 1 8 8 v24 h-600 z"/>
  <text class="bart" x="40" y="45">1EV_BTO-1A_TIC.xlsx</text>
  <rect class="hdr" x="25" y="56" width="598" height="22"/>
  <text class="col" x="133" y="71" text-anchor="middle">A</text>
  <text class="col" x="253" y="71" text-anchor="middle">B</text>
  <text class="col" x="328" y="71" text-anchor="middle">C</text>
  <text class="col" x="491" y="71" text-anchor="middle">D</text>
  <line class="grid" x1="24" y1="78" x2="624" y2="78"/>
  <text class="col" x="41" y="99" text-anchor="middle">1</text>
  <text class="b" x="68" y="99">Apellidos</text>
  <text class="b" x="218" y="99">Nombre</text>
  <text class="b" x="308" y="99">Nota</text>
  <text class="b" x="368" y="99">Observaciones</text>
  <line class="grid" x1="24" y1="112" x2="624" y2="112"/>
  <text class="col" x="41" y="133" text-anchor="middle">2</text>
  <text class="td" x="68" y="133">García López</text>
  <text class="td" x="218" y="133">Ana</text>
  <text class="td" x="308" y="133">7</text>
  <text class="s" x="368" y="133">Muy buen trabajo en el proyecto final.</text>
  <line class="grid" x1="24" y1="146" x2="624" y2="146"/>
  <text class="col" x="41" y="167" text-anchor="middle">3</text>
  <text class="td" x="68" y="167">Pérez Martínez</text>
  <text class="td" x="218" y="167">Iñigo</text>
  <text class="td" x="308" y="167">9</text>
  <line class="grid" x1="24" y1="180" x2="624" y2="180"/>
  <text class="col" x="41" y="201" text-anchor="middle">4</text>
  <text class="td" x="68" y="201">Etxeberria Goñi</text>
  <text class="td" x="218" y="201">Maite</text>
  <line class="grid" x1="24" y1="214" x2="624" y2="214"/>
  <text class="col" x="41" y="235" text-anchor="middle">5</text>
  <text class="td" x="68" y="235">Ruiz Sanz</text>
  <text class="td" x="218" y="235">Pablo</text>
  <text class="td" x="308" y="235">6</text>
  <text class="s" x="368" y="235">Debe entregar las prácticas pendientes.</text>
  <line class="grid" x1="24" y1="248" x2="624" y2="248"/>
  <text class="col" x="41" y="269" text-anchor="middle">6</text>
  <text class="td" x="68" y="269">Navarro Díaz</text>
  <text class="td" x="218" y="269">Lucía</text>
  <text class="td" x="308" y="269">5</text>
  <line class="grid" x1="58" y1="56" x2="58" y2="282"/>
  <line class="grid" x1="208" y1="56" x2="208" y2="282"/>
  <line class="grid" x1="298" y1="56" x2="298" y2="282"/>
  <line class="grid" x1="358" y1="56" x2="358" y2="282"/>
  <rect class="hl" x="27" y="80" width="594" height="30" rx="4"/>
  <rect class="hl" x="301" y="183" width="54" height="28" rx="4"/>
  <circle class="numyou" cx="210" cy="40" r="10"/><text class="n" x="210" y="45" text-anchor="middle" style="font-size:12px">1</text>
  <circle class="numyou" cx="610" cy="95" r="10"/><text class="n" x="610" y="100" text-anchor="middle" style="font-size:12px">2</text>
  <circle class="numyou" cx="328" cy="197" r="10"/><text class="n" x="328" y="202" text-anchor="middle" style="font-size:12px">3</text>
  <circle class="numyou" cx="538" cy="67" r="10"/><text class="n" x="538" y="72" text-anchor="middle" style="font-size:12px">4</text>
  <circle class="numyou" cx="664" cy="46" r="10"/><text class="n" x="664" y="51" text-anchor="middle" style="font-size:12px">1</text>
  <text class="b" x="684" y="51">Nombre del fichero</text>
  <text class="s" x="684" y="71">EVALUACIÓN_GRUPO_MATERIA. Así lo</text>
  <text class="s" x="684" y="88">encuentra solo en tu carpeta de notas.</text>
  <circle class="numyou" cx="664" cy="110" r="10"/><text class="n" x="664" y="115" text-anchor="middle" style="font-size:12px">2</text>
  <text class="b" x="684" y="115">Cabeceras en la primera fila</text>
  <text class="s" x="684" y="135">Una fila por alumno. Si tus columnas</text>
  <text class="s" x="684" y="152">se llaman distinto, díselo en el chat.</text>
  <circle class="numyou" cx="664" cy="174" r="10"/><text class="n" x="664" y="179" text-anchor="middle" style="font-size:12px">3</text>
  <text class="b" x="684" y="179">Nota en blanco</text>
  <text class="s" x="684" y="199">Ese alumno se salta. Las notas con</text>
  <text class="s" x="684" y="216">decimales se avisan, no se redondean.</text>
  <circle class="numyou" cx="664" cy="238" r="10"/><text class="n" x="664" y="243" text-anchor="middle" style="font-size:12px">4</text>
  <text class="b" x="684" y="243">Observaciones, opcional</text>
  <text class="s" x="684" y="263">Comentario para las familias, hasta</text>
  <text class="s" x="684" y="280">4000 caracteres por alumno.</text>
  <text class="note" x="24" y="306">Datos inventados.</text>
</svg>
